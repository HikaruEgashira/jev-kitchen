# pnpm 10+ はパッケージ設定をここに置く（package.json の "pnpm" フィールドは読まれない）。
# wrangler が依存する esbuild / workerd は postinstall で実行ファイルを配置するため許可する。
allowBuilds:
  esbuild: true
  workerd: true
minimumReleaseAgeExclude:
  - '@pmndrs/glyph@0.1.0'
overrides:
  'vite@*': npm:@voidzero-dev/vite-plus-core@0.3.2
patchedDependencies:
  three@0.186.0: patches/three@0.186.0.patch
peerDependencyRules:
  allowedVersions:
    vite: '*'
