name: train-laya-jp

# RLCD fine-tune of laya-multilingual on jev-bench rollout data.
# Runs on a self-hosted runner with GPU/MPS (labels: laya-train) because the
# torch+model download (~3GB) and training belong outside CI runners.
on:
  workflow_dispatch:
    inputs:
      record:
        description: "Path to a checked-in --record JSONL (decision + shift lines)"
        required: false
        default: "train/data/teacher.jsonl"
      epochs:
        description: "RLCD epochs"
        required: false
        default: "3"
      game_weight:
        description: "Weight of the bench-outcome REINFORCE term"
        required: false
        default: "1.0"

permissions:
  contents: read

jobs:
  train:
    runs-on: [self-hosted, laya-train]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Python and training environment
        run: |
          python3 -m venv .venv-train
          source .venv-train/bin/activate
          pip install --quiet torch transformers datasets safetensors huggingface_hub laya
          echo "VIRTUAL_ENV=$PWD/.venv-train" >> "$GITHUB_ENV"

      - name: RLCD training (laya-jp)
        run: |
          source .venv-train/bin/activate
          test -f "${{ inputs.record }}" || { echo "record file missing: ${{ inputs.record }}"; exit 1; }
          python train/laya_jp.py \
            --record "${{ inputs.record }}" \
            --epochs "${{ inputs.epochs }}" \
            --game-weight "${{ inputs.game_weight }}" \
            --output-dir train/laya-jp-out

      - name: Upload checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: laya-jp-checkpoint
          path: train/laya-jp-out/
          retention-days: 7

      - name: Verify checkpoint serves
        run: |
          source .venv-train/bin/activate
          python - <<'EOF'
          import json
          from pathlib import Path
          from safetensors.torch import load_file
          from transformers import AutoTokenizer
          from laya.common import build_model
          d = Path("train/laya-jp-out")
          cfg = json.load(open(d / "rl_agent_config.json"))
          m = build_model(cfg, encoder_dir=d / "encoder")
          m.load_state_dict(load_file(str(d / "model.safetensors")), strict=True)
          print("verify OK: checkpoint loads, model_name =", cfg.get("model_name"))
          EOF