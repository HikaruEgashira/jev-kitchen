<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SIDEKICK kitchen — 言わなくても連携できる、AIの相棒</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0f16;
        --panel: #121a26;
        --line: #24314a;
        --text: #e7eefc;
        --dim: #9fb3d1;
        --accent: #ffd166;
        --blue: #7cc4ff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 system-ui, -apple-system, "Hiragino Sans", sans-serif;
        display: flex;
        justify-content: center;
        padding: 20px;
      }
      #wrap { display: flex; gap: 20px; align-items: flex-start; }
      canvas { border-radius: 14px; border: 1px solid var(--line); display: block; }
      aside {
        width: 340px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 16px;
      }
      h1 { font-size: 18px; margin: 0 0 4px; letter-spacing: .04em; }
      h1 span { color: var(--dim); font-weight: 400; }
      .hint { color: var(--dim); font-size: 12px; margin-bottom: 14px; }
      label { display: block; font-size: 12px; color: var(--dim); margin: 14px 0 6px; }
      #modes { display: flex; gap: 6px; }
      button {
        font: inherit;
        font-size: 12px;
        color: var(--text);
        background: #1b2536;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 9px;
        cursor: pointer;
      }
      button:hover { border-color: #3a4a63; }
      #modes button.on { background: var(--accent); color: #0b0f16; border-color: var(--accent); }
      textarea {
        width: 100%;
        resize: vertical;
        font: inherit;
        font-size: 13px;
        color: var(--text);
        background: #0e1420;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px;
      }
      .presets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
      .presets button { text-align: left; }
      dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 4px 12px;
        margin: 16px 0 0;
        font-size: 12px;
      }
      dt { color: var(--dim); }
      dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
      #log {
        margin-top: 16px;
        max-height: 220px;
        overflow-y: auto;
        border-top: 1px solid var(--line);
        padding-top: 10px;
        font-size: 12px;
      }
      .logline { padding: 2px 0; color: var(--dim); }
      .logline .tag { color: var(--accent); margin-right: 6px; }
    </style>
  </head>
  <body>
    <div id="wrap">
      <canvas id="game" width="900" height="520"></canvas>
      <aside>
        <h1>SIDEKICK <span>kitchen</span></h1>
        <div class="hint">
          WASD で移動 / E で作業。あなたが動くだけで、相棒が役割を見つけます。
        </div>

        <label>相棒のエンジン</label>
        <div id="modes">
          <button data-mode="jev" class="on">Jev</button>
          <button data-mode="rule">固定ルール</button>
          <button data-mode="llm">低遅延LLM</button>
        </div>

        <label>協働方針（自由記述・いつでも変更可）</label>
        <textarea id="policy" rows="3" placeholder="例: 最後の盛り付けは自分でやりたい"></textarea>
        <div class="presets">
          <button>最後の盛り付けは自分でやりたい</button>
          <button>今は注文を最優先。私のやりかけも引き継いでいい</button>
          <button>下準備を練習したいから、そこは任せて</button>
        </div>

        <dl>
          <dt>相棒の行動</dt><dd id="s-action">—</dd>
          <dt>判断に使った状態</dt><dd id="s-obs">—</dd>
          <dt>鮮度（観測からの経過）</dt><dd id="s-age">—</dd>
          <dt>応答時間</dt><dd id="s-lat">—</dd>
          <dt>確信度</dt><dd id="s-conf">—</dd>
          <dt>候補数</dt><dd id="s-cands">—</dd>
          <dt>破棄した古い判断</dt><dd id="s-drop">0 / 0</dd>
          <dt>配膳数</dt><dd id="s-score">0</dd>
        </dl>

        <div id="log"></div>
      </aside>
    </div>
    <script type="module" src="/game.js"></script>
  </body>
</html>
